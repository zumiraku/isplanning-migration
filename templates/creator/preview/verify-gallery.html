<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サブ画像ギャラリー 検証</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  body { font: 14px/1.6 system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
         margin: 0; padding: 24px; background: #f6f7f9; color: #16181d; }
  .wrap { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #5a616e; margin: 0 0 20px; max-width: 66ch; }
  .tile { display: inline-block; background: #fff; border: 1px solid #dfe3ea; border-radius: 8px; padding: 10px 14px; margin: 0 8px 16px 0; min-width: 96px; }
  .tile b { display: block; font-size: 22px; line-height: 1.2; }
  .tile.pass b { color: #1a7f45; }
  .tile.fail b { color: #b3261e; }
  .tile.pending b { color: #8a6d1f; }
  tr.pending { background: #fff8e6; } tr.pending td.v { color: #8a6d1f; font-weight: 700; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 13px; }
  th, td { border: 1px solid #dfe3ea; padding: 6px 8px; text-align: left; }
  th { background: #eef1f6; }
  tr.fail { background: #fdf0ef; } tr.fail td.v { color: #b3261e; font-weight: 700; }
  td.v.ok { color: #1a7f45; font-weight: 600; }
  .stage { background: #fff; border: 1px solid #dfe3ea; border-radius: 8px; padding: 16px; margin: 0 0 20px; max-width: 30rem; }
  .note { background: #fff8e6; border: 1px solid #e8d9a8; border-radius: 8px; padding: 12px 16px; margin: 0 0 20px; }
</style>
</head>
<body>
<div class="wrap">

<h1>サブ画像ギャラリー 検証（C22）</h1>
<p class="sub">
  ご要望いただいた「スマホではスワイプできれば」の動作確認です。
  スワイプ自体はCSSのスクロールスナップで動くため、JavaScriptが読み込めなくても
  画像はすべて見られます。JavaScriptは、いま何枚目かをサムネイルと点の表示に
  反映させる役目だけを持っています。
</p>

<div class="note">
  下のギャラリーは実際の部品そのものです。サムネイルを押す、指で横に払う、
  どちらでも動きます。ページを開いた時点で下の項目が自動で確認されます。
</div>

<div class="stage">
  <div class="gallery" data-gallery>
    <div class="gallery__track" data-gallery-track>
      <div class="gallery__slide" data-gallery-slide="0">メイン画像</div>
      <div class="gallery__slide" data-gallery-slide="1">サブ画像 1</div>
      <div class="gallery__slide" data-gallery-slide="2">サブ画像 2</div>
      <div class="gallery__slide" data-gallery-slide="3">サブ画像 3</div>
      <div class="gallery__slide" data-gallery-slide="4">サブ画像 4</div>
    </div>
    <div class="gallery__dots" aria-hidden="true">
      <span data-gallery-dot data-active></span><span data-gallery-dot></span><span data-gallery-dot></span><span data-gallery-dot></span><span data-gallery-dot></span>
    </div>
    <ul class="gallery__thumbs">
      <li><button type="button" class="gallery__thumb" data-gallery-thumb aria-current="true">1</button></li>
      <li><button type="button" class="gallery__thumb" data-gallery-thumb aria-current="false">2</button></li>
      <li><button type="button" class="gallery__thumb" data-gallery-thumb aria-current="false">3</button></li>
      <li><button type="button" class="gallery__thumb" data-gallery-thumb aria-current="false">4</button></li>
      <li><button type="button" class="gallery__thumb" data-gallery-thumb aria-current="false">5</button></li>
    </ul>
  </div>
</div>

<div id="summary"></div>
<div id="report"></div>

</div>

<!-- The production file, unmodified. -->
<script src="../js/gallery.js"></script>
<script>
(function () {
  'use strict';

  /* Assertions drive the same markup the product page ships, the way a person
     does - clicking a thumbnail, then moving the track - rather than checking
     that the elements merely exist. A gallery that is present but inert is the
     failure mode worth catching. */
  var rows = [];
  function check(name, cond, detail) { rows.push({ name: name, ok: !!cond, detail: detail || '' }); }

  window.addEventListener('load', function () {
    var root = document.querySelector('[data-gallery]');
    var track = root && root.querySelector('[data-gallery-track]');
    var thumbs = root ? root.querySelectorAll('[data-gallery-thumb]') : [];
    var dots = root ? root.querySelectorAll('[data-gallery-dot]') : [];
    var slides = root ? root.querySelectorAll('[data-gallery-slide]') : [];

    check('ギャラリーが存在する', !!root);
    check('横スクロールできる状態', track && track.scrollWidth > track.clientWidth + 1,
          track ? track.scrollWidth + 'px / 表示幅 ' + track.clientWidth + 'px' : '');
    check('画像・サムネイル・点の数が一致', thumbs.length === slides.length && dots.length === slides.length,
          slides.length + '枚 / ' + thumbs.length + '個 / ' + dots.length + '個');
    check('スクロールスナップが効いている',
          track && getComputedStyle(track).scrollSnapType.indexOf('x') === 0,
          track ? getComputedStyle(track).scrollSnapType : '');
    check('JavaScriptなしでも全画像に到達できる',
          track && getComputedStyle(track).overflowX === 'auto',
          'スワイプ自体はCSSのみで成立しています');

    var pageY = window.scrollY;
    var before = track ? track.scrollLeft : 0;
    if (thumbs.length > 2) { thumbs[2].click(); }

    setTimeout(function () {
      var after = track ? track.scrollLeft : 0;
      check('サムネイルを押すと画像が動く', after > before, before + 'px → ' + after + 'px');
      check('ページ自体はスクロールしない', window.scrollY === pageY);
      check('押したサムネイルが選択状態になる', thumbs.length > 2 && thumbs[2].getAttribute('aria-current') === 'true');
      check('前のサムネイルの選択が外れる', thumbs.length > 0 && thumbs[0].getAttribute('aria-current') === 'false');
      check('点の表示も連動する', dots.length > 2 && dots[2].hasAttribute('data-active'));

      /* The follow-the-swipe behaviour is driven by an IntersectionObserver.
         Headless Chrome does not deliver IO callbacks under its virtual-time
         clock, and the checks above passed through the click handler calling
         setActive directly rather than through the observer. So a timeout here
         says something about the harness, not about the gallery - and calling it
         a failure would be as wrong as calling it a pass. It is held open, and
         it is the one thing on this page that has to be confirmed by a person
         with a real browser. */
      if (track) { track.scrollLeft = 0; }
      var waited = 0;
      (function poll() {
        var followed = thumbs.length > 0 && thumbs[0].getAttribute('aria-current') === 'true';
        if (followed) {
          check('スワイプするとサムネイルが追随する', true, waited + 'ms で反映');
          render();
          return;
        }
        if (waited >= 2000) {
          rows.push({
            name: 'スワイプするとサムネイルが追随する',
            pending: true,
            detail: 'この項目は自動確認できません（IntersectionObserverはヘッドレスでは動きません）。実際のブラウザで、指またはマウスで横に払ってお確かめください。'
          });
          render();
          return;
        }
        waited += 50;
        setTimeout(poll, 50);
      })();
    }, 400);
  });

  function render() {
    var pass = rows.filter(function (r) { return r.ok; }).length;
    var pending = rows.filter(function (r) { return r.pending; }).length;
    var fail = rows.length - pass - pending;

    document.getElementById('summary').innerHTML =
      '<div class="tile pass"><b>' + pass + '</b>合格</div>' +
      '<div class="tile ' + (fail ? 'fail' : '') + '"><b>' + fail + '</b>不合格</div>' +
      (pending ? '<div class="tile pending"><b>' + pending + '</b>要目視確認</div>' : '');

    var html = '<table><thead><tr><th style="width:40%">確認項目</th><th style="width:12%">結果</th><th>内容</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var cls = r.pending ? 'pending' : (r.ok ? '' : 'fail');
      var mark = r.pending ? '要目視' : (r.ok ? '合格' : '不合格');
      html += '<tr class="' + cls + '"><td>' + r.name + '</td>' +
              '<td class="v ' + (r.ok ? 'ok' : '') + '">' + mark + '</td>' +
              '<td>' + r.detail + '</td></tr>';
    });
    document.getElementById('report').innerHTML = html + '</tbody></table>';
    document.title = (fail ? 'NG ' + fail : 'OK ' + pass + (pending ? ' +' + pending + '要目視' : '')) +
                     ' — サブ画像ギャラリー 検証';
  }
})();
</script>
</body>
</html>
